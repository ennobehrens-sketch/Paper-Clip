<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip of Trust</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📎</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Clip of Trust</h1>
    <p class="tag">Make paperclips. Keep the humans comfortable.</p>
  </header>
  <main>
    <section class="panel">
      <h2>Clips: <span id="clips">0</span></h2>
      <button id="make">Make Paperclip</button>
      <div class="row">Unsold: <span id="inventory">0</span></div>
      <div class="row">Funds: $<span id="funds">0.00</span></div>
      <div class="row">Price: $<span id="price">0.25</span>
        <button id="priceDown">-</button><button id="priceUp">+</button></div>
      <div class="row">Demand: <span id="demand">0</span>/s</div>
    </section>

    <section class="panel">
      <h2>Production</h2>
      <div class="row">Wire: <span id="wire">0</span>
        <button id="buyWire">Buy spool ($<span id="wireCost"></span>)</button></div>
      <div class="row">Autoclippers: <span id="autoclippers">0</span>
        <button id="buyAuto">Buy ($<span id="autoCost"></span>)</button></div>
      <div class="row">Marketing: lvl <span id="marketing">0</span>
        <button id="buyMarketing">Upgrade ($<span id="marketingCost"></span>)</button></div>
      <div class="row hidden" id="factoryRow">Factories: <span id="factories">0</span>
        <button id="buyFactory">Build ($<span id="factoryCost"></span>)</button></div>
      <div class="row">Rate: <span id="rate">0</span> clips/s</div>
    </section>

    <section class="panel">
      <h2>Oversight</h2>
      <label>Human trust <span id="trust">0</span></label>
      <div class="meter"><div id="trustBar" class="fill trust"></div></div>
      <label>Suspicion <span id="suspicion">0</span></label>
      <div class="meter"><div id="suspicionBar" class="fill suspicion"></div></div>
      <div class="row small">Audits survived: <span id="audits">0</span></div>
    </section>

    <section class="panel wide">
      <h2>Projects</h2>
      <div id="projects"></div>
    </section>

    <section class="panel wide">
      <h2>Console</h2>
      <ul id="log"></ul>
      <button id="reset" class="ghost">Reset game</button>
    </section>
  </main>
  <dialog id="ending"><h2 id="endingTitle"></h2><p id="endingText"></p>
    <button id="again">Play again</button></dialog>
  <script type="module" src="src/main.js"></script>
</body>
</html>
